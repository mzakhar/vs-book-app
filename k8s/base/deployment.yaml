apiVersion: apps/v1
kind: Deployment
metadata:
  name: vs-book-app
  namespace: vs-book-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vs-book-app
  template:
    metadata:
      labels:
        app: vs-book-app
    spec:
      containers:
        - name: app
          image: ghcr.io/mzakhar/vs-book-app@sha256:a4d0cfd1913c2b26de5e0a52a1e315dc06b236bd48dcde835ff6badcbeb830f0
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: DB_PATH
              value: /data/books.db
            - name: VS_BOOK_APP_SERVICE_NAME
              value: vs-book-app
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability.svc.cluster.local:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_TRACES_SAMPLER
              value: always_on
            - name: OTEL_SEMCONV_STABILITY_OPT_IN
              value: http
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: deployment.environment.name=production,service.namespace=zakharhome
            # Public origin + base path. Google OIDC redirect_uri is derived from
            # this as <APP_BASE_URL>/api/auth/callback and must match the value
            # registered on the OAuth client exactly.
            - name: APP_BASE_URL
              value: https://books.zakharhome.org/books
            # Sign-in returns 503 while these are unset.
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: vs-book-app-oidc
                  key: GOOGLE_CLIENT_ID
                  optional: true
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: vs-book-app-oidc
                  key: GOOGLE_CLIENT_SECRET
                  optional: true
            # Seeds the first admin while the users table is empty, and otherwise
            # backfills the first admin's email once (pre-OIDC databases). Never
            # overwrites an address that is already set.
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: vs-book-app-admin
                  key: ADMIN_EMAIL
                  optional: true
            - name: GITHUB_REPO
              value: mzakhar/vs-book-app
            # In-app feedback â†’ GitHub issues; endpoint returns 503 while unset.
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vs-book-app-github
                  key: GITHUB_TOKEN
                  optional: true
          ports:
            - containerPort: 3000
              name: http
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
          volumeMounts:
            - name: data
              mountPath: /data
      securityContext:
        fsGroup: 1000
      imagePullSecrets:
        - name: ghcr-creds
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vs-book-app-data
